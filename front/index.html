<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- yawasla:boot -->
    <!-- Icône unique (carré ≥ 512 px) : un seul fichier à remplacer quand l'organisme la changera -->
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Thème appliqué avant le premier rendu : choix enregistré, sinon préférence du système
      ;(function () {
        var theme = null
        try {
          theme = localStorage.getItem('yawasla-theme')
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.setAttribute('data-theme', theme)
      })()
    </script>
    <title>Yawasla</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
